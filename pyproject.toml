[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "transcript-reconciler"
version = "0.1.0"
description = "Reconcile multiple AI transcripts while surfacing ambiguous speaker boundaries for review"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "storywriter" }]
dependencies = []

[project.scripts]
transcript-reconcile = "transcript_reconciler.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
